# A throwaway PostgreSQL instance for db-backup-postgres to actually back up
# (and that workflows/export-csv-to-cos exports from - same instance, not a
# separate one). In a real cluster this would be a managed database or a
# StatefulSet with a real PersistentVolumeClaim; an emptyDir + single
# Deployment replica is enough for a lab whose point is the Workflows, not
# HA Postgres.
#
# IMPORTANT if you edit init.sql or zz-create-reader-role.sh: scripts in
# docker-entrypoint-initdb.d only run once, against a brand-new empty data
# directory. Applying an updated ConfigMap here does NOT re-run them against
# the already-initialized `data` emptyDir - you have to force a fresh init:
#   kubectl -n argo apply -f postgres.yaml
#   kubectl -n argo delete pod -l app=db-backup-postgres
#   kubectl -n argo rollout status deploy/postgres
# Deleting the pod is safe: `data` is an emptyDir tied to the pod, so a new
# pod gets a genuinely empty volume and re-runs every init script - but it
# also means this really does erase and reseed everything, every time.
apiVersion: v1
kind: Secret
metadata:
  name: db-backup-postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: labuser
  POSTGRES_PASSWORD: lab-password-change-me
  POSTGRES_DB: labdb
  # Bootstrap password for the read-only role created below. Kept in this
  # Secret (not hardcoded into the init script) so it's sourced the same
  # way POSTGRES_PASSWORD already is - via envFrom on the postgres
  # container - rather than sitting in plaintext inside a ConfigMap.
  EXPORT_READER_PASSWORD: export-reader-password-change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-backup-postgres-initdb
data:
  # Also the table set workflows/export-csv-to-cos/workflow.yaml exports -
  # both examples share this one Postgres instance.
  init.sql: |
    CREATE TABLE widgets (
      id SERIAL PRIMARY KEY,
      name TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO widgets (name) VALUES ('sprocket'), ('gizmo'), ('doohickey');

    CREATE TABLE customers (
      id SERIAL PRIMARY KEY,
      name TEXT NOT NULL,
      email TEXT NOT NULL
    );
    INSERT INTO customers (name, email) VALUES
      ('Ada Lovelace', 'ada@example.com'),
      ('Grace Hopper', 'grace@example.com');

    CREATE TABLE orders (
      id SERIAL PRIMARY KEY,
      customer_id INTEGER NOT NULL REFERENCES customers(id),
      widget_id INTEGER NOT NULL REFERENCES widgets(id),
      quantity INTEGER NOT NULL DEFAULT 1,
      ordered_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO orders (customer_id, widget_id, quantity) VALUES
      (1, 1, 3),
      (1, 2, 1),
      (2, 3, 5);
  # docker-entrypoint-initdb.d runs files in (lexically sorted) filename
  # order, and this one has to run after init.sql: `GRANT ... ON ALL
  # TABLES` only covers tables that already exist at the moment it runs.
  # `.sh` (not `.sql`) so it's sourced directly by the entrypoint and can
  # see $EXPORT_READER_PASSWORD from the container's own environment,
  # instead of the password having to be written into this ConfigMap.
  zz-create-reader-role.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE export_csv_reader WITH LOGIN PASSWORD '$EXPORT_READER_PASSWORD';
      GRANT USAGE ON SCHEMA public TO export_csv_reader;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO export_csv_reader;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO export_csv_reader;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    lab.example.com/concept: db-backup-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-backup-postgres
  template:
    metadata:
      labels:
        app: db-backup-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-backup-postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "labuser", "-d", "labdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: initdb
          configMap:
            name: db-backup-postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    lab.example.com/concept: db-backup-postgres
spec:
  selector:
    app: db-backup-postgres
  ports:
    - port: 5432
      targetPort: 5432
