# export-csv-to-cos: runs a defined list of *named* SELECT queries against
# Postgres - not just plain `SELECT * FROM table`, but whatever shape of
# query the report actually needs (filtered, sorted, joined across tables,
# aggregated) - one CSV per query, then uploads them to an S3-compatible
# bucket (IBM Cloud Object Storage in production; this lab points `mc` at
# the in-cluster MinIO instead, since mc's commands are byte-for-byte
# identical against either).
#
# Both steps get their credentials from Vault via the Agent Injector - no
# credentials are ever written into this manifest or into a Kubernetes
# Secret the workflow itself owns. See vault-setup.md for the one-time
# Vault configuration (auth method, policies, roles, seeded secrets) this
# depends on.
#
# The two steps share one Postgres-to-CSV-to-COS pipeline over a single
# workflow-scoped PersistentVolumeClaim (`work`, declared in
# spec.volumeClaimTemplates below) - `export-csv` writes CSVs to it,
# `upload-cos` reads them back. Each step is still its own Pod; the PVC,
# not a container filesystem, is what makes the data survive between them.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: export-csv-to-cos-
  labels:
    lab.example.com/concept: export-csv-to-cos
spec:
  entrypoint: main
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  arguments:
    parameters:
      # A defined, static list of {name, sql} pairs, one CSV per entry.
      # `name` becomes the output filename and must be a plain identifier
      # (validated below); `sql` is a full SELECT and is trusted content -
      # it comes from whoever submits this workflow, the same trust level
      # as any other workflow parameter, not from an untrusted end user.
      # Four different query shapes on purpose: a plain full-table select,
      # a filtered+sorted select, and two join+aggregate queries pairing
      # orders against each of the other two tables.
      - name: queries
        value: |
          [
            {"name": "widgets_all", "sql": "SELECT * FROM widgets ORDER BY id"},
            {"name": "orders_last_7_days", "sql": "SELECT * FROM orders WHERE ordered_at > now() - interval '7 days' ORDER BY ordered_at DESC"},
            {"name": "customer_order_totals", "sql": "SELECT c.name AS customer, SUM(o.quantity) AS total_quantity FROM orders o JOIN customers c ON c.id = o.customer_id GROUP BY c.name ORDER BY total_quantity DESC"},
            {"name": "widget_popularity", "sql": "SELECT w.name AS widget, COUNT(*) AS times_ordered, SUM(o.quantity) AS total_units FROM orders o JOIN widgets w ON w.id = o.widget_id GROUP BY w.name ORDER BY total_units DESC"}
          ]

  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi

  templates:
    - name: main
      steps:
        - - name: export-csv
            template: export-csv
            arguments:
              parameters:
                - name: queries
                  value: "{{workflow.parameters.queries}}"
        - - name: upload-cos
            template: upload-cos

    - name: export-csv
      serviceAccountName: export-csv-cos-pg-sa
      metadata:
        annotations:
          vault.hashicorp.com/agent-inject: "true"
          # Populate the secret file via an init container only, then exit -
          # without this, the injector also adds a long-running sidecar that
          # never terminates, and the pod hangs forever waiting for it.
          vault.hashicorp.com/agent-pre-populate-only: "true"
          vault.hashicorp.com/role: "export-csv-cos-pg"
          vault.hashicorp.com/agent-inject-secret-db-creds.sh: "secret/data/db/postgres"
          vault.hashicorp.com/agent-inject-template-db-creds.sh: |
            {{- with secret "secret/data/db/postgres" -}}
            export PGHOST="{{ .Data.data.host }}"
            export PGPORT="{{ .Data.data.port }}"
            export PGUSER="{{ .Data.data.username }}"
            export PGPASSWORD="{{ .Data.data.password }}"
            export PGDATABASE="{{ .Data.data.database }}"
            {{- end -}}
      inputs:
        parameters:
          - name: queries
      script:
        image: postgres:16-alpine
        command: [sh]
        env:
          # Passed as an env var, not interpolated straight into the script
          # source - Kubernetes hands env values to the container verbatim,
          # so the JSON's own quotes/braces never get a second pass through
          # anything that treats them as YAML or shell syntax.
          - name: QUERIES
            value: "{{inputs.parameters.queries}}"
        source: |
          set -eu
          . /vault/secrets/db-creds.sh
          mkdir -p /work/csv

          # No jq, no apk install (would need root - this pod runs as a
          # fixed non-root UID). Postgres already has a JSON parser and
          # psql is already here, so let the server unpack $QUERIES:
          # `:'queries_json'` is psql's own bind-style substitution, which
          # SQL-quotes the value correctly (embedded quotes, backslashes,
          # newlines) without any hand-rolled escaping on our part. That
          # substitution only happens for SQL psql reads as a script/from
          # stdin, not for a `-c "..."` argument - piping it in via printf
          # instead of using -c is what makes :'queries_json' work at all.
          TAB=$(printf '\t')
          printf "%s\n" "SELECT elem->>'name', elem->>'sql' FROM jsonb_array_elements(:'queries_json'::jsonb) AS elem;" \
            | psql -X -v ON_ERROR_STOP=1 -At -F "$TAB" -v queries_json="$QUERIES" \
            > /tmp/queries.tsv

          # Build every \copy as one line in a single script instead of
          # opening a fresh psql connection per query - fine either way at
          # 4 queries, but a real difference at scale (each psql invocation
          # is its own TCP + auth handshake). \copy writes straight to a
          # file path here instead of STDOUT + shell redirection, since
          # they're all sharing one psql process now.
          : > /tmp/copy-commands.sql
          while IFS="$TAB" read -r name sql; do
            case "$name" in
              *[!a-zA-Z0-9_]*)
                echo "refusing to use invalid output name: $name" >&2
                exit 1
                ;;
            esac
            printf "\\\\copy (%s) TO '/work/csv/%s.csv' WITH CSV HEADER\n" "$sql" "$name" >> /tmp/copy-commands.sql
          done < /tmp/queries.tsv

          echo "running $(wc -l < /tmp/copy-commands.sql) quer(y/ies) in one psql session:"
          cat /tmp/copy-commands.sql
          psql -X -v ON_ERROR_STOP=1 < /tmp/copy-commands.sql

          echo "export complete:"
          for f in /work/csv/*.csv; do
            echo "  $f -> $(( $(wc -l < "$f") - 1 )) data row(s)"
          done
          ls -la /work/csv
        volumeMounts:
          - name: work
            mountPath: /work
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

    - name: upload-cos
      serviceAccountName: export-csv-cos-upload-sa
      metadata:
        annotations:
          vault.hashicorp.com/agent-inject: "true"
          vault.hashicorp.com/agent-pre-populate-only: "true"
          vault.hashicorp.com/role: "export-csv-cos-upload"
          vault.hashicorp.com/agent-inject-secret-cos-creds.sh: "secret/data/cos/ibm"
          vault.hashicorp.com/agent-inject-template-cos-creds.sh: |
            {{- with secret "secret/data/cos/ibm" -}}
            export COS_ENDPOINT="{{ .Data.data.endpoint }}"
            export COS_ACCESS_KEY="{{ .Data.data.access_key }}"
            export COS_SECRET_KEY="{{ .Data.data.secret_key }}"
            export COS_BUCKET="{{ .Data.data.bucket }}"
            {{- end -}}
      script:
        image: minio/mc:latest
        command: [sh]
        env:
          # mc defaults to $HOME/.mc, which isn't writable for an arbitrary
          # non-root UID with no passwd entry - point it somewhere on the
          # writable PVC instead of relying on $HOME being set at all.
          - name: MC_CONFIG_DIR
            value: /work/.mc
        source: |
          set -eu
          . /vault/secrets/cos-creds.sh
          mc alias set cos "$COS_ENDPOINT" "$COS_ACCESS_KEY" "$COS_SECRET_KEY"
          # IBM COS buckets are normally pre-provisioned; --ignore-existing
          # keeps this idempotent for the lab's throwaway bucket either way.
          mc mb --ignore-existing "cos/$COS_BUCKET"
          mc cp /work/csv/*.csv "cos/$COS_BUCKET/{{workflow.name}}/"
          echo "uploaded objects:"
          mc ls "cos/$COS_BUCKET/{{workflow.name}}/"
        volumeMounts:
          - name: work
            mountPath: /work
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
